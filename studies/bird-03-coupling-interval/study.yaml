schema_version: 3
name: bird-03-coupling-interval
status: complete
question: |
  Can the reactor coupling/update interval be exposed as a tunable parameter,
  and does the coupled trajectory converge as the interval decreases?
hypothesis: |
  Making the interval configurable and shrinking it produces a convergent
  dissolved-O2 trajectory (changes below tolerance under interval halving),
  so the interval can trade fidelity against cost without changing the
  qualitative result.
objective: |
  Expose the coupling interval as a parameter and measure the dissolved-O2
  trajectory across interval values to determine convergence behavior.
description: |
  The BiRD coupling interval is currently fixed. This study parameterizes it
  and characterizes convergence, resolving the coupler-timestep-tunability
  question raised by v2ecoli mbp-03. Builds on the live coupled loop from
  bird-02.
parent_studies:
- {study: bird-02-closed-loop-liveness, condition: tests-passed}
# Behavior tests in the structured (given, measure, expect) grammar; all
# status: stub (xfail) until Phase-1 + bird-02 land the coupled composite and a
# tunable interval. The convergence test is a cross-run comparison the current
# grammar doesn't express directly (no multi-run-diff measure) — placeholder
# here; see framework log #14 vicinity.
expected_behavior:
- name: coupling-interval-is-configurable
  en: "The coupling/update interval is a process parameter with a documented default, and runs honor the
    configured value."
  given: {run: baseline, window: full}
  measure: {kind: listener_path, path: "coupling_interval", reduce: median}
  expect: {op: in_range, low: 0.0, high: 1.0e6}
  status: verified
  requires: [variant_hook: coupling_interval]
  notes: "Verified by tests/test_bird03_coupling_interval.py::test_coupling_interval_is_configurable —
    the interval is a composite parameter threaded onto both processes; runs honor it (smaller interval
    → more steps for the same horizon)."
  result: PASS
  verified_by: tests/test_bird03_coupling_interval.py
- name: coupled-trajectory-converges-as-interval-decreases
  en: "Halving the coupling interval changes the dissolved-O2 trajectory by less than a stated tolerance
    — convergence rather than interval-dependence."
  given: {run: baseline, window: full}
  measure: {kind: listener_path, path: "dissolved_o2", reduce: series}
  expect: {op: in_range, low: 0.0, high: 8.0}
  status: verified
  requires: [variant_hook: coupling_interval]
  notes: "Verified by tests/test_bird03_coupling_interval.py::test_coupled_trajectory_converges_as_interval_decreases
    — DO at a fixed time converges to a fine reference as the interval halves (errors strictly decreasing;
    finest < 0.005 mg/L). Cross-run convergence isn't expressible in the dashboard grammar (issue #96),
    hence pytest."
  result: PASS
  verified_by: tests/test_bird03_coupling_interval.py
