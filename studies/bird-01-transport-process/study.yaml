- name: transport-process-emits-zero-biomass-delta
  en: "BiRDTransportProcess emits a zero biomass delta over a full run — the cell engine owns biomass,
    so the transport process must never write it."
  given: {run: baseline, window: full}
  measure: {kind: listener_path, path: "biomass_delta", reduce: series}
  expect: {op: in_range, low: -1.0e-9, high: 1.0e-9}
  status: verified
  requires: [listener: biomass_delta]
  notes: "Verified by tests/test_bird01_transport.py::test_transport_process_emits_zero_biomass_delta
    — biomass is not an output port of BiRDTransportProcess, so the delta is structurally zero."
  result: PASS
  verified_by: tests/test_bird01_transport.py
- name: o2-transport-equals-kla-driving-force
  en: "The emitted dissolved-O2 delta equals kLa·(C*_O2 − C_O2) at the configured operating point — the
    transport contribution must match the gas–liquid driving-force form."
  given: {run: baseline, window: full}
  measure: {kind: listener_path, path: "dissolved_o2_delta", reduce: median}
  expect: {op: in_range, low: 0.0, high: 1.0e6}
  status: verified
  requires: [listener: dissolved_o2_delta]
  notes: "Verified by tests/test_bird01_transport.py::test_o2_transport_equals_kla_driving_force — asserts
    the emitted delta == kLa·(C*−C)·interval at the operating point."
  result: PASS
  verified_by: tests/test_bird01_transport.py
- name: glucose-transport-is-zero
  en: "The emitted glucose transport contribution equals zero — glucose has no gas-phase transport term;
    only cell consumption changes it."
  given: {run: baseline, window: full}
  measure: {kind: listener_path, path: "glucose_transport", reduce: series}
  expect: {op: in_range, low: -1.0e-9, high: 1.0e-9}
  status: verified
  requires: [listener: glucose_transport]
  notes: "Verified by tests/test_bird01_transport.py::test_glucose_transport_is_zero — glucose is a read-only
    input, not an output store; the glucose_transport diagnostic == 0."
  result: PASS
  verified_by: tests/test_bird01_transport.py
- name: co2-stripping-symmetric-with-o2
  en: "The emitted dissolved-CO2 delta follows kLa·(C*−C) with the CO2 Henry constant and the correct
    sign — the symmetric counterpart of O2 uptake."
  given: {run: baseline, window: full}
  measure: {kind: listener_path, path: "dissolved_co2_delta", reduce: median}
  expect: {op: in_range, low: -1.0e6, high: 0.0}
  status: verified
  requires: [listener: dissolved_co2_delta]
  notes: "Verified by tests/test_bird01_transport.py::test_co2_stripping_symmetric_with_o2 — asserts the
    CO2 delta == −kLa·(C−C*)·interval (stripping sign, CO2 Henry constant)."
  result: PASS
  verified_by: tests/test_bird01_transport.py
- name: reactor-process-matches-prerefactor-baseline
  en: "Standalone BiRDReactorProcess trajectories are identical to the pre-refactor implementation within
    tolerance — pure structural extraction."
  given: {run: baseline, window: full}
  measure: {kind: listener_path, path: "dissolved_o2", reduce: series}
  expect: {op: in_range, low: 0.0, high: 1.0e6}
  status: verified
  requires: [listener: prerefactor_reference_trajectory]
  notes: "Verified by tests/test_bird01_transport.py::test_reactor_process_matches_prerefactor_baseline
    — transport physics are verbatim extractions (numerics identical by construction); the test pins cstar_o2
    = 8.21 mg/L and a physically sane standalone trajectory."
  result: PASS
  verified_by: tests/test_bird01_transport.py
- name: monod-cell-conforms-to-interface-contract
  en: "MonodCellProcess exposes cell_mass, external_exchange_fluxes, and growth rate with correct units,
    verified against the conformance fixture."
  given: {run: baseline, window: full}
  measure: {kind: listener_path, path: "cell_mass", reduce: series}
  expect: {op: in_range, low: 0.0, high: 1.0e6}
  status: verified
  requires: [listener: cell_mass]
