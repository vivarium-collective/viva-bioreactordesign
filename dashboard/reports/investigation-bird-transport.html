<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BiRD reactor transport refactor for cell-engine coupling — report</title>
<style>
:root{
  --paper:#FAF9F6; --surface:#FFFFFF; --sunken:#F4F2ED;
  --ink:#1F1D1B; --ink-2:#57534E; --ink-3:#8A857D;
  --line:#E7E4DE; --line-2:#D8D4CC;
  --accent:#0F766B; --accent-soft:#0F766B22;
  --pass:#1A7F5A; --fail:#B42318; --warn:#A16207; --cal:#0E7490;
  --pass-soft:#1A7F5A18; --fail-soft:#B4231814; --warn-soft:#A1620714;
  --chip:#F1EFEA;
  --shadow:0 1px 2px rgba(30,25,20,.04),0 1px 0 var(--line);
  --serif:"Iowan Old Style","Palatino Nova",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161513; --surface:#1E1C19; --sunken:#232019;
  --ink:#EDEAE3; --ink-2:#A8A29B; --ink-3:#78736B;
  --line:#37332D; --line-2:#453F37;
  --accent:#3FB9A5; --accent-soft:#3FB9A526;
  --pass:#43C08D; --fail:#E5675C; --warn:#D9A036; --cal:#4CC3E0;
  --pass-soft:#43C08D1f; --fail-soft:#E5675C1c; --warn-soft:#D9A0361c;
  --chip:#2A2723;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 0 var(--line);
}}
:root[data-theme="dark"]{
  --paper:#161513; --surface:#1E1C19; --sunken:#232019;
  --ink:#EDEAE3; --ink-2:#A8A29B; --ink-3:#78736B;
  --line:#37332D; --line-2:#453F37;
  --accent:#3FB9A5; --accent-soft:#3FB9A526;
  --pass:#43C08D; --fail:#E5675C; --warn:#D9A036; --cal:#4CC3E0;
  --pass-soft:#43C08D1f; --fail-soft:#E5675C1c; --warn-soft:#D9A0361c;
  --chip:#2A2723;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 0 var(--line);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;scroll-padding-top:64px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1440px;margin:0 auto;padding:0 40px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.mono{font-family:var(--mono);font-size:.9em}
.serif{font-family:var(--serif)}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:.01em;white-space:nowrap}
.brand .dot{color:var(--accent)}
.switch{display:flex;gap:4px;margin-left:auto;background:var(--sunken);border:1px solid var(--line);
  border-radius:999px;padding:3px}
.switch button{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-2);
  background:none;border:none;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.switch button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.switch-label{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.switch-label+.switch{margin-left:10px}
.themebtn{background:none;border:1px solid var(--line);color:var(--ink-2);width:34px;height:34px;
  border-radius:8px;cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center}

/* ---- masthead ---- */
.masthead{padding:44px 0 8px}
.masthead .eyebrow{color:var(--ink-3);font-size:12.5px;letter-spacing:.04em;margin-bottom:10px}
.masthead h1{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.12;margin:0;
  letter-spacing:-.01em;text-wrap:balance;max-width:20ch}
.provline{color:var(--ink-3);font-size:13px;margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.provline .sep{opacity:.5}

/* ---- verdict banner ---- */
.verdict{margin:28px 0 8px;padding:24px 26px 24px 30px;background:var(--surface);border:1px solid var(--line);
  border-left:4px solid var(--pass);border-radius:12px;box-shadow:var(--shadow)}
.verdict.is-fail{border-left-color:var(--fail)}
.verdict .vhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.verdict .vtext{font-family:var(--serif);font-size:20px;line-height:1.4;color:var(--ink);margin:0;max-width:none}
.verdict .what{color:var(--ink-2);font-size:14.5px;margin-top:14px;max-width:none}

/* status chip */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.03em;
  padding:4px 11px;border-radius:999px;text-transform:uppercase}
.status.pass{color:var(--pass);background:var(--pass-soft)}
.status.fail{color:var(--fail);background:var(--fail-soft)}
.status.warn{color:var(--warn);background:var(--warn-soft)}
.status .g{width:7px;height:7px;border-radius:999px;background:currentColor}

/* ---- stat strip ---- */
.stats{display:flex;flex-wrap:wrap;gap:0;margin:22px 0;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);overflow:hidden}
.stats .stat{flex:1;min-width:120px;padding:16px 18px;border-right:1px solid var(--line)}
.stats .stat:last-child{border-right:none}
.stats .num{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1}
.stats .lbl{color:var(--ink-2);font-size:12.5px;margin-top:6px}
.stats .num.pass{color:var(--pass)}.stats .num.fail{color:var(--fail)}

/* ---- section headers ---- */
.sec-h{display:flex;align-items:baseline;gap:12px;margin:44px 0 16px}
.sec-h h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0}
.sec-h .rule{flex:1;height:1px;background:var(--line)}

/* ---- glance table ---- */
.glance{width:100%;border-collapse:collapse;font-size:14px}
.glance th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);padding:8px 12px;border-bottom:1px solid var(--line-2)}
.glance td{padding:11px 12px;border-bottom:1px solid var(--line)}
.glance tr:hover td{background:var(--sunken)}
.glance .idx{color:var(--ink-3);font-family:var(--mono);width:26px}
.glance a.st{font-weight:600;color:var(--ink)}
.glance a.st:hover{color:var(--accent);text-decoration:none}
.glance .flag{color:var(--warn);font-size:11.5px;font-weight:700;margin-left:8px}

/* ---- sticky nav ---- */
.subnav{position:sticky;top:56px;z-index:30;background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line);border-top:1px solid var(--line);margin-top:36px}
.subnav .wrap{display:flex;gap:4px;height:44px;align-items:center;overflow-x:auto;scrollbar-width:none}
.subnav .wrap::-webkit-scrollbar{display:none}
.subnav a{font-size:12.5px;color:var(--ink-2);padding:5px 10px;border-radius:7px;white-space:nowrap;font-weight:500}
.subnav a.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.subnav a.exec{font-weight:600}

/* ---- study card ---- */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:26px 28px;margin:24px 0;box-shadow:var(--shadow);scroll-margin-top:112px}
.card::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:3px;background:var(--pass)}
.card.is-fail::before{background:var(--fail)}
.card.is-control{border-style:dashed;border-color:var(--line-2)}
/* collapsed cards are wholly clickable — signal it clearly */
.card.collapsed{cursor:pointer;padding-bottom:44px;transition:box-shadow .15s ease,border-color .15s ease,transform .12s ease}
.card.collapsed:hover{border-color:var(--accent);box-shadow:0 6px 22px rgba(30,25,20,.10),0 1px 0 var(--line);transform:translateY(-1px)}
.card.collapsed::after{content:"Click to expand ▾";position:absolute;right:24px;bottom:16px;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);pointer-events:none}
.card.collapsed:hover::after{color:var(--accent)}
.card.collapsed:hover .ctoggle{color:var(--accent)}
.card-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:4px;cursor:pointer;user-select:none}
.card-h .ctoggle{color:var(--ink-3);font-size:15px;padding-top:5px;transition:transform .15s,color .15s;line-height:1}
.card.collapsed .card-h .ctoggle{transform:rotate(-90deg)}
.card-h .cnum{font-family:var(--mono);color:var(--ink-3);font-size:14px;padding-top:5px}
/* collapse behaviour */
.card.collapsed .study-detail{display:none}
.card:not(.collapsed) .study-summary{display:none}
.study-summary{margin-top:10px}
.summary-chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:6px 0}
.summary-snip{color:var(--ink-2);font-size:13.5px;max-width:none;margin-top:6px}
.studies-toolbar{display:flex;gap:8px;align-items:center;margin-left:auto}
.studies-toolbar button{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
.studies-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.card-h .ctitle{font-family:var(--serif);font-size:22px;font-weight:600;margin:0;flex:1;line-height:1.2}
.card-h .cright{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.control-kick{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 10px;border-radius:999px}
.claim{font-family:var(--serif);font-size:16.5px;color:var(--ink);margin:8px 0 2px;max-width:none;font-style:italic}
.biology{color:var(--ink-2);font-size:14px;margin:8px 0 4px;max-width:none}

/* spine stage */
.stage{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.stage:first-of-type{border-top:none}
.stage>.kicker{display:block;margin-bottom:12px}
.substage{margin:14px 0}
.substage .slabel{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.kv{color:var(--ink);font-size:14.5px}
.kv .rationale{color:var(--ink-2);font-size:13.5px;margin-top:4px;max-width:none}
.decision-line{font-size:15px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;
  border-radius:999px;background:var(--chip);color:var(--ink-2);white-space:nowrap}
.chip.pass{color:var(--pass);background:var(--pass-soft)}
.chip.fail{color:var(--fail);background:var(--fail-soft)}
.chip.decision{background:none;border:1px solid var(--accent);color:var(--accent)}
.chip.mod{background:none;border:1px solid var(--line-2);color:var(--ink);font-family:var(--mono);font-size:11.5px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

/* mini table for tests */
.ttable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
.ttable td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ttable tr:last-child td{border-bottom:none}
.ttable .tname{font-weight:600}
.ttable .texp{color:var(--ink-3);font-family:var(--mono);font-size:12px}
.ttable .tv{text-align:right;white-space:nowrap}

/* decision box */
.decbox{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--sunken);
  border-radius:10px;margin-top:6px}
.decbox>div:last-child{flex:1 1 auto;min-width:0}
.decbox .dverdict{font-size:14px}
.decbox .dnarr{color:var(--ink-2);font-size:13.5px;margin-top:6px;max-width:none}

/* figures */
figure{margin:12px 0 4px}
figure svg{max-width:100%;height:auto;display:block}
figure img{max-width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.spine-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--ink-2)}
.spine-badge.v-passed{color:var(--pass);background:var(--pass-soft)}
.spine-badge.v-failing{color:var(--fail);background:var(--fail-soft)}
.spine-badge.v-blocked,.spine-badge.v-needs_calibration{color:var(--warn);background:var(--warn-soft)}
.spine-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.spine-legend-item{font-size:11.5px;color:var(--ink-2)}
.study-verdict-dag,.acceptance-rollup,.ac-gating-matrix{margin-top:4px}
.ac-gating-matrix .gap,.acceptance-rollup td{font-size:13.5px}
figcaption{color:var(--ink-2);font-size:12.5px;margin-top:8px;max-width:none}
.fig-scroll{overflow-x:auto}
.loom-embed{margin:12px 0 4px}
.loom-frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);height:440px;resize:vertical;min-height:240px}
/* An inlined local: visualization runs in its own iframe so its scripts execute
   and its (often full-document) CSS can't leak into the report. onload sizes it
   to content; this is the pre-resize default. */
.viz-frame{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);height:460px;display:block}
/* embedded REAL bigraph-loom (primary Model view) */
.loom-real-slot{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface);height:560px;overflow:hidden;resize:vertical;min-height:280px}
.loom-real-slot iframe{width:100%;height:100%;border:0;display:block}
.loom-real-boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:12px}
/* interactive lightweight loom */
.iloom{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface);height:520px;overflow:hidden}
.iloom svg{width:100%;height:100%;cursor:grab;display:block}
.iloom svg.grabbing{cursor:grabbing}
.iloom .il-proc,.iloom .il-comp{cursor:pointer}
.iloom .il-comp{cursor:pointer}
.iloom .il-proc rect,.iloom .il-comp rect{transition:opacity .12s}
.iloom .dim{opacity:.18}
.iloom .il-edge.off{stroke-opacity:.05!important}
.iloom .il-edge.on{stroke-opacity:.95!important;stroke-width:2.2!important}
.iloom .il-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:11px;line-height:1.35;
  padding:6px 9px;border-radius:6px;max-width:340px;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.iloom .il-hint{position:absolute;left:10px;bottom:8px;font-size:10.5px;color:var(--ink-3);background:var(--surface);
  padding:2px 7px;border-radius:6px;border:1px solid var(--line);opacity:.9}
.iloom .il-stores{position:absolute;right:10px;top:10px;max-width:46%;max-height:70%;overflow:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.iloom .il-leaves{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.iloom .il-leaf{font-family:var(--mono);font-size:10px;background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
/* An interactive (Plotly) figure rendered inline in the main document, sharing
   the report's one Plotly.js. Bordered like the iframe path it replaces. */
.embedded-plotly .plotly-holder{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px;overflow:hidden}
.embedded-plotly .plotly-holder>div{max-width:100%}
.loom-iframe{width:100%;height:100%;border:0;display:block}
.loom-fallback{margin-top:6px}
.loom-fallback>summary{cursor:pointer;color:var(--accent);font-size:12px;user-select:none}
.loom-fallback[open]>summary{margin-bottom:6px}

/* expander */
details.exp{margin-top:10px;border-top:1px dotted var(--line-2);padding-top:8px}
details.exp>summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600;list-style:none}
details.exp>summary::-webkit-details-marker{display:none}
details.exp>summary::before{content:"▸ ";color:var(--ink-3)}
details.exp[open]>summary::before{content:"▾ "}
details.exp .body{font-size:13.5px;color:var(--ink-2);margin-top:8px;max-width:none}

/* appendix */
.appendix{margin:52px 0 24px}
.cat-table{width:100%;border-collapse:collapse;font-size:13.5px}
.cat-table td,.cat-table th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cat-table th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.cat-table .m{font-family:var(--mono);font-weight:600;color:var(--ink);white-space:nowrap}

/* breadcrumb + prev/next + study grid */
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);padding:26px 0 2px}
.crumb a{color:var(--ink-2);font-weight:600}
.crumb .cur{color:var(--ink)}
.crumb .chev{opacity:.5}
.prevnext{display:flex;justify-content:space-between;gap:12px;margin:28px 0 8px}
.prevnext a{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface);
  display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.prevnext a:hover{border-color:var(--accent);text-decoration:none}
.prevnext a.next{text-align:right;align-items:flex-end}
.prevnext .dir{font-size:11px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
.prevnext .nm{font-family:var(--serif);font-size:15px;color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:8px}
.gcard{position:relative;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--surface);
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.gcard:hover{border-color:var(--accent);text-decoration:none}
.gcard::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--pass)}
.gcard.is-fail::before{background:var(--fail)}
.gcard .gh{display:flex;align-items:baseline;gap:8px}
.gcard .gn{font-family:var(--mono);color:var(--ink-3);font-size:12px}
.gcard .gt{font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--ink);flex:1;line-height:1.2}
.gcard .grole{color:var(--ink-2);font-size:12.5px}
.gcard .gclaim{color:var(--ink-2);font-size:13px;line-height:1.5;font-style:italic}
.gcard .gfoot{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.gcard .garrow{color:var(--accent);font-size:13px;font-weight:600}
/* per-section feedback bubble */
.fbsection{position:relative}
.fbbubble{position:absolute;right:-6px;top:-4px;width:26px;height:26px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-3);font-size:13px;line-height:1;cursor:pointer;opacity:0;
  transition:opacity .12s,transform .12s,color .12s,border-color .12s;box-shadow:var(--shadow);display:grid;place-items:center;z-index:5}
.fbsection:hover>.fbbubble{opacity:.85}
.fbbubble:hover{opacity:1 !important;transform:scale(1.08);color:var(--accent);border-color:var(--accent)}
.fbbubble.has{opacity:1;color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.fbbubble.has::after{content:"";position:absolute;right:-1px;top:-1px;width:8px;height:8px;border-radius:999px;background:var(--accent);border:1.5px solid var(--surface)}
.fbeditor-wrap{margin-top:12px;padding:12px 14px;background:var(--sunken);border:1px solid var(--line);border-radius:10px}
.fbeditor-wrap .fbrow{margin-top:0;padding-top:0;border-top:none}
@media(max-width:640px){.fbbubble{opacity:.6}}
/* feedback */
.fbrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px dashed var(--line-2)}
.fbrow .fblabel{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.fbdisp{display:flex;gap:4px}
.fbdisp button{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer}
.fbdisp button.on-ok{background:var(--pass-soft);color:var(--pass);border-color:transparent}
.fbdisp button.on-rev{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.fbrow input.fbnote{flex:1;min-width:180px;font-family:var(--sans);font-size:13px;color:var(--ink);

ent kLa (from Higbie penetration theory), the\ntemperature-dependent Henry's-law saturation concentration C*, and Wilke–Chang\nliquid diffusivity. For a 0D well-mixed reactor the transport contribution to a\ndissolved species is kLa·(C*−C): positive uptake for O2, symmetric stripping for\nCO2, and exactly zero for glucose, which has no gas phase.\n\nThe fix is a single-responsibility split. Transport physics moves into a shared\nmodule; the biomass/consumption term is factored into a small MonodCellProcess\nthat conforms to the cell-side contract; and a new BiRDTransportProcess reads\nbiomass, substrate, and dissolved-gas concentrations as inputs and emits only\nthe transport deltas. Standalone BiRDReactorProcess becomes MonodCellProcess +\ntransport recomposed, so its behavior is preserved exactly. Because\nprocess-bigraph aggregates updates, the cell's exchange deltas and the reactor's\ntransport deltas land at the same dissolved-species stores and sum cleanly.\n\nThis matters because it unlocks feedback a single-process reactor cannot express:\nonce biomass is external, a dense culture can draw dissolved O2 below saturation\nand the reactor state responds to the cell — the bidirectional coupling that\nPhases 2–4 test, and the reactor-physics dependency that v2ecoli's mbp-03 study\nis blocked on.\n", "baseline": [{"name": "standalone-reactor", "composite": "viva_bioreactordesign.composites.reactor", "params": {}}], "runs": [{"name": "viva_bioreactordesign.composites.reactor__1790634881__0d09ca", "status": "completed", "timestamp": 1790634883.742558, "emitter": {"kind": "unknown"}, "env_id": "37e6580089c0db0e", "params": "{}", "provenance": {"params": {"n_steps": {"value": 40, "source": "resolved"}}, "params_captured_at": "2026-09-28", "params_source": "dashboard-runner"}}], "pipeline_gate": {"gate_evaluator": {"result": "blocked", "blocked_by": ["transport-process-emits-zero-biomass-delta", "o2-transport-equals-kla-driving-force", "glucose-transport-is-zero", "co2 l", "figures_embedded": [{"name": "Bird 03 dashboard", "html": "\u003cdiv style=\"max-width:1200px;margin:14px auto 0;padding:0 16px;\n            font-family:-apple-system, system-ui, sans-serif;color:#0f172a;\">\n  \u003cdiv style=\"font-size:22px;font-weight:650;letter-spacing:-0.01em;\">\n    BiRD-03 · Coupling-interval convergence\u003c/div>\n  \u003cdiv style=\"font-size:14px;color:#334155;margin-top:4px;\">\n    Claim: the reactor coupling/update interval is a tunable parameter, and the\n    coupled dissolved-O₂ trajectory \u003cb>converges as the interval decreases\n    (Δt → 0)\u003c/b>.\u003c/div>\n  \u003cdiv style=\"font-size:12px;color:#64748b;margin-top:6px;line-height:1.5;\">\n    \u003cb>Provenance\u003c/b> · composite\n    \u003ccode>viva_bioreactordesign.composites.coupled_reactor_cell\u003c/code>\n    (\u003ccode>make_coupled_document\u003c/code>, growth on, initial biomass 0.1 g/L,\n    initial DO 8.0 mg/L) · common horizon \u003cb>4 h\u003c/b> ·\n    intervals Δt=0.08h (50 steps), Δt=0.04h (100 steps), Δt=0.02h (200 steps), Δt=0.01h (400 steps) · fine reference Δt=0.0025 h\n    (1600 steps).\u003cbr>\n    \u003cspan style=\"color:#94a3b8;\">Sub-hour Δt: the transport term uses an\n    explicit step, stable only for kLa·Δt ≲ 1\n    (kLa≈11/h ⇒ Δt≲ 0.09 h). Coarser intervals\n    sit in the explicit-Euler overshoot regime and diverge — the very\n    interval-dependence this study characterizes; convergence is shown in the\n    stable regime, matching the study's acceptance test.\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"max-width:1200px;margin:0 auto;padding:4px 8px 24px;\">\n  \u003cdiv id=\"bird03-figure\">\u003c/div>\n\u003c/div>\n\u003cscript>\n  var fig = {\"data\": [{\"type\": \"scatter\", \"mode\": \"lines\", \"x\": [0.0, 0.08, 0.16, 0.24, 0.32, 0.4, 0.48000000000000004, 0.56, 0.64, 0.72, 0.7999999999999999, 0.8799999999999999, 0.9599999999999999, 1.0399999999999998, 1.1199999999999999, 1.2, 1.28, 1.36, 1.4400000000000002, 1.52  "s": "biomass"}, {"p": "transport", "c": "stores", "s": "glucose"}, {"p": "transport", "c": "stores", "s": "gas_flow_rate_Lpm"}, {"p": "transport", "c": "stores", "s": "o2_transport_delta"}, {"p": "transport", "c": "stores", "s": "co2_transport_delta"}, {"p": "transport", "c": "stores", "s": "kla_o2"}, {"p": "transport", "c": "stores", "s": "o2_saturation"}, {"p": "transport", "c": "stores", "s": "gas_holdup"}, {"p": "cell", "c": "stores", "s": "dissolved_o2"}, {"p": "cell", "c": "stores", "s": "biomass"}, {"p": "cell", "c": "stores", "s": "dissolved_co2"}, {"p": "cell", "c": "stores", "s": "cell_mass"}, {"p": "cell", "c": "stores", "s": "specific_growth_rate"}, {"p": "cell", "c": "stores", "s": "external_exchange_fluxes"}, {"p": "cell", "c": "stores", "s": "o2_exchange_delta"}, {"p": "emitter", "c": "stores", "s": "dissolved_o2"}, {"p": "emitter", "c": "stores", "s": "dissolved_co2"}, {"p": "emitter", "c": "stores", "s": "biomass"}, {"p": "emitter", "c": "stores", "s": "cell_mass"}, {"p": "emitter", "c": "stores", "s": "specific_growth_rate"}, {"p": "emitter", "c": "stores", "s": "o2_transport_delta"}, {"p": "emitter", "c": "stores", "s": "o2_exchange_delta"}, {"p": "emitter", "c": "stores", "s": "kla_o2"}], "composite": "viva_bioreactordesign.composites.coupled_reactor_cell"}, "verdict": "blocked", "verdict_counts": {"passed": 0, "skipped": 0, "failed": 0}, "computed_gate_verdict": {"result": "blocked", "blocked_by": ["geometry-selectable-via-config", "kla-matches-stirred-tank-correlation"], "evaluated_by": "code", "diverges_from_authored": false}, "run_commands": {"baseline": "vwb run study bird-04-reactor-geometry", "variants": [], "simulations": [{"name": "coupled-reactor-cell-baseline", "cmd": "vwb run study bird-04-reactor-geometry"}], "rerun_hint": "vwb rerun \u003crun-id>"}}], "loom_embed": {"loom": "../bigraph-loom/index.html", "state": "../api/composite-state/"}}</script>
<script>
const INV = JSON.parse(document.getElementById('data').textContent);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Light markdown for authored prose fields (conclusions carry ## headers, **bold**, `code`).
function mdLite(t){
  if(t==null) return '';
  let s=esc(t);
  s=s.replace(/\s*#{2,}\s*([^\n]+?)\s*-\s+/g,'<br><b>$1</b> — ');   // "## Claims - " → bold header
  s=s.replace(/\s*#{1,}\s*([^\n]+)/g,'<br><b>$1</b>');              // any remaining # header
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/`([^`]+)`/g,'<span class="mono">$1</span>');
  return s.replace(/^\s*<br>\s*/,'');
}

// The Model-section "loom view": the composite's resolved bigraph — the nested
// state tree (name : type) beside the process list (name · address · ports).
function loomTopoSVG(topo){
  if(!topo) return '';
  const procs=topo.processes||[], stores=topo.stores||[];
  const rows=[]; (function fl(ns,d){ (ns||[]).forEach(n=>{ rows.push({d,n}); fl(n.children,d+1); }); })(stores,0);
  if(!rows.length && !procs.length) return '';
  const rowH=23, headH=28, padX=14, colGap=44;
  const storeW=Math.max(240,...rows.map(r=>padX+r.d*16+(String(r.n.name).length)*7+(String(r.n.type||'').length)*6.2+70));
  const procH=64;
  const procW=Math.max(250,...procs.map(p=>Math.max(String(p.name).length*8+28,
      String(p.address||'').length*6.2+20,
      (('in: '+(p.inputs||[]).join(', ')).length)*6.0+20,
      (('out: '+(p.outputs||[]).join(', ')).length)*6.0+20)));
  const storesH=headH+rows.length*rowH+8, procsH=headH+procs.length*(procH+10);
  const H=Math.max(storesH,procsH)+14, W=storeW+colGap+procW+padX;
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12">`;
  sv+=`<text x="${padX}" y="16" fill="var(--ink-3)" font-size="10" letter-spacing=".08em">STATE · BIGRAPH</text>`;
  rows.forEach((r,i)=>{ const y=headH+i*rowH, x=padX+r.d*16, leaf=!(r.n.children&&r.n.children.length);
    if(r.d>0) sv+=`<line x1="${x-8}" y1="${y+ (rowH-4)/2}" x2="${x}" y2="${y+(rowH-4)/2}" stroke="var(--line-2)"/>`;
    sv+=`<rect x="${x}" y="${y}" width="${storeW-x-6}" height="${rowH-5}" rx="5" fill="${leaf?'var(--sunken)':'var(--surface)'}" stroke="var(--line)"/>`;
    sv+=`<text x="${x+9}" y="${y+13}" fill="var(--ink)" font-family="var(--mono)" font-size="11.5">${esc(r.n.name)}</text>`;
    if(r.n.type) sv+=`<text x="${storeW-12}" y="${y+13}" text-anchor="end" fill="var(--accent)" font-size="10.5" font-family="var(--mono)">${esc(r.n.type)}</text>`;
  });
  const px=storeW+colGap;
  sv+=`<text x="${px}" y="16" fill="var(--ink-3)" font-size="10" letter-spacing=".08em">PROCESSES</text>`;
  procs.forEach((p,i)=>{ const y=headH+i*(procH+10);
    sv+=`<rect x="${px}" y="${y}" width="${procW}" height="${procH}" rx="9" fill="var(--surface)" stroke="var(--accent)"/>`;
    sv+=`<text x="${px+12}" y="${y+21}" fill="var(--ink)" font-weight="700" font-family="var(--mono)" font-size="12.5">${esc(p.name)}</text>`;
    if(p.address) sv+=`<text x="${px+12}" y="${y+36}" fill="var(--ink-3)" font-size="10.5" font-family="var(--mono)">${esc(p.address)}</text>`;
    sv+=`<text x="${px+12}" y="${y+50}" fill="var(--ink-2)" font-size="10.5">in: <tspan fill="var(--ink)">${esc((p.inputs||[]).join(', ')||'—')}</tspan></text>`;
    sv+=`<text x="${px+12}" y="${y+62}" fill="var(--ink-2)" font-size="10.5">out: <tspan fill="var(--ink)">${esc((p.outputs||[]).join(', ')||'—')}</tspan></text>`;
  });
  sv+=`</svg>`;
  const cap=`Static topology of <span class="mono">${esc(topo.composite||'')}</span> — ${procs.length} process${procs.length==1?'':'es'} over ${rows.length} state node${rows.length==1?'':'s'}.`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>${cap}</figcaption></figure>`;
}

// ---------- lightweight INTERACTIVE bigraph loom (self-contained, no server) ----------
// A pan/zoom bipartite view of the composite: process nodes on the left wired to
// the top-level store compartments on the right (from topo.edges). Hover a
// process to read its contract and light up the compartments it touches; hover a
// compartment to light up the processes that read/write it; click a compartment
// to expand its store leaves. Vanilla SVG + a little JS — embeds directly in the
// static report and works offline.
let _ILOOM_SEQ=0;
function loomInteractive(topo){
  if(!topo) return '';
  const procs=topo.processes||[], edges=topo.edges||[];
  // The biological compartments are the children of the single "cell" root (a
  // process-bigraph store tree nests everything under one root), so unwrap a
  // lone root to its children. Fall back to whatever compartments the edges
  // actually reference so nothing is dropped.
  let roots=topo.stores||[];
  if(roots.length===1 && (roots[0].children||[]).length) roots=roots[0].children;
  let comps=roots.map(n=>n.name).filter(Boolean);
  const edgeComps=[...new Set(edges.map(e=>e.c).filter(Boolean))];
  // keep only compartments that carry edges, in store-tree order, then append
  // any edge compartments the tree didn't name (defensive).
  const compSet0=new Set(comps);
  comps=comps.filter(c=>edgeComps.includes(c)).concat(edgeComps.filter(c=>!compSet0.has(c)));
  if(!comps.length) comps=edgeComps;
  if(!procs.length || !comps.length) return '';
  // leaves per compartment (for click-to-expand): flatten each compartment subtree.
  const leavesByComp={};
  roots.forEach(n=>{ const out=[]; (function fl(ns){(ns||[]).forEach(c=>{ if(!(c.children&&c.children.length)) out.push(c.name); fl(c.children);});})(n.children); leavesByComp[n.name]=out.length?out:[n.name]; });
  const compSet=new Set(comps);
  const id='il'+(++_ILOOM_SEQ);
  const rowH=26, padY=34, pW=210, cW=200, gap=230, cx0=24;
  const compX=cx0+pW+gap;
  const H=Math.max(procs.length,comps.length)*rowH+padY*2, W=compX+cW+cx0;
  const py=i=>padY+i*rowH+ (Math.max(0,(comps.length-procs.length))*rowH)/2;
  const cy=i=>padY+i*rowH+ (Math.max(0,(procs.length-comps.length))*rowH)/2;
  const compIdx={}; comps.forEach((c,i)=>compIdx[c]=i);
  const palette=['#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd','#8c564b','#17becf','#bcbd22'];
  const compColor=c=>palette[(compIdx[c]||0)%palette.length];
  let g='';
  // edges
  edges.forEach(e=>{
    const pi=procs.findIndex(p=>p.name===e.p); if(pi<0||!compSet.has(e.c)) return;
    const x1=cx0+pW, y1=py(pi)+rowH/2-3, x2=compX, y2=cy(compIdx[e.c])+rowH/2-3, mx=(x1+x2)/2;
    g+=`<path class="il-edge" data-p="${esc(e.p)}" data-c="${esc(e.c)}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${compColor(e.c)}" stroke-opacity=".28" stroke-width="1.1"/>`;
  });
  // process nodes
  procs.forEach((p,i)=>{ const y=py(i);
    g+=`<g class="il-proc" data-proc="${esc(p.name)}" tabindex="0"
          onmouseenter="_iloomHi('${id}','proc','${esc(p.name)}')" onmouseleave="_iloomClear('${id}')"
          onmousemove="_iloomTip(event,'${id}',${JSON.stringify(esc(p.name)+' — '+(p.doc||p.address||'')).replace(/"/g,'&quot;')})">
        <rect x="${cx0}" y="${y}" width="${pW}" height="${rowH-6}" rx="7" fill="var(--surface)" stroke="var(--accent)"/>
        <text x="${cx0+10}" y="${y+14}" font-family="var(--mono)" font-size="11" fill="var(--ink)">${esc(p.name)}</text></g>`;
  });
  // compartment nodes
  comps.forEach((c,i)=>{ const y=cy(i), n=(leavesByComp[c]||[]).length;
    g+=`<g class="il-comp" data-comp="${esc(c)}" tabindex="0"
          onmouseenter="_iloomHi('${id}','comp','${esc(c)}')" onmouseleave="_iloomClear('${id}')"
          onclick="_iloomExpand('${id}','${esc(c)}')"
          onmousemove="_iloomTip(event,'${id}',${JSON.stringify(esc(c)+' — '+'store compartment').replace(/"/g,'&quot;')})">
        <rect x="${compX}" y="${y}" width="${cW}" height="${rowH-6}" rx="7" fill="${compColor(c)}22" stroke="${compColor(c)}"/>
        <text x="${compX+10}" y="${y+14}" font-family="var(--mono)" font-size="11" fill="var(--ink)">${esc(c)} <tspan fill="var(--ink-3)">· ${n}</tspan></text></g>`;
  });
  const leavesJSON=esc(JSON.stringify(leavesByComp)).replace(/"/g,'&quot;');
  return `<figure class="iloom-fig">
    <div class="iloom" id="${id}" data-leaves="${leavesJSON}">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><g class="il-view">${g}</g></svg>
      <div class="il-tip" hidden></div>
      <div class="il-hint">drag to pan · scroll to zoom · hover a process for its contract · click a compartment to list its stores</div>
    </div>
    <figcaption><b>bigraph-loom</b> (interactive) — <span class="mono">${esc(topo.composite||'')}</span>: ${procs.length} processes wired to ${comps.length} cell compartments.</figcaption>
  </figure>`;
}
// Embed the REAL bigraph-loom for a study's baseline composite — the same live
// loom the workbench serves at /bigraph-loom/, so the Model section shows loom's
// own rendering instead of a re-drawn topology. Returns '' when no composite is
// known (caller then falls back to the static topology SVG). When the report is
// opened standalone (file://) the loom route is unreachable and the iframe stays
// blank — the caption's "static topology" <details> is the offline fallback.
function loomEmbed(s){
  const cid=(s.model_topology&&s.model_topology.composite) || (s.baseline&&s.baseline[0]&&s.baseline[0].composite);
  if(!cid) return '';
  const topo=s.model_topology?loomTopoSVG(s.model_topology):'';
  // No live loom to embed → nothing to add beyond the static topology, which
  // the caller renders directly. Returning '' lets modelBody fall through to it.
  if(!topo) return '';
  const snap=document.body.classList.contains('snapshot');
  const base='bigraph-loom/index.html';
  const src=snap
    ? base+'?static=1&stateUrl='+encodeURIComponent('api/composite-state/'+encodeURIComponent(cid)+'.json')+'&chrome=off'
    : base+'?id='+encodeURIComponent(cid)+'&live=1&chrome=off';
  // The static topology is the VISIBLE model figure — it always renders, live
  // server or not (a downloaded standalone report has no reachable loom route,
  // so a live iframe would just be a blank box). The interactive loom is an
  // opt-in enhancement tucked behind a <details> for deployments served
  // alongside the loom bundle.
  return `<figure class="loom-embed">
      <div class="kicker" style="margin-bottom:6px">Model — bigraph of <span class="mono">${esc(cid)}</span></div>
      ${topo}
      <figcaption>The composite's bigraph (processes, stores, and their wiring).
        <details class="loom-fallback"><summary>open the interactive bigraph-loom view</summary>
          <div class="loom-frame"><iframe class="loom-iframe" title="bigraph-loom — ${esc(cid)}" src="${esc(src)}" loading="lazy"></iframe></div>
        </details></figcaption>
    </figure>`;
}
// PRIMARY Model view (published bundle only): the REAL bigraph-loom, embedded
// chromeless + stripped (?embed=1) and driven by the composite-state snapshot
// that ships beside the report. This is the genuine loom renderer — process
// rectangles, store circles, the place-graph nesting and wiring, click a process
// for its contract — not a re-drawing. The two base URLs come from the DATA
// (INV.loom_embed), set only when publishing alongside the loom bundle; a
// standalone/self-contained report has no INV.loom_embed, so this returns '' and
// the Model section falls back to the inlined image / static topology.
// setupRealLooms() mounts it lazily and, if it can't boot, reveals the fallback.
function loomRealEmbed(s){
  const le=INV.loom_embed; if(!le||!le.loom||!le.state) return '';
  const cid=(s.model_topology&&s.model_topology.composite)||(s.baseline&&s.baseline[0]&&s.baseline[0].composite);
  if(!cid) return '';
  const stateUrl=le.state+encodeURIComponent(cid)+'.json';
  const src=le.loom+'?embed=1&static=1&stateUrl='+encodeURIComponent(stateUrl)+'&tab=explore';
  const fb=(s.model_loom
      ? `<div class="loom-frame" style="height:auto;max-height:640px;overflow:auto"><img src="${s.model_loom}" alt="bigraph-loom view of ${esc(cid)}" style="width:100%;display:block"/></div>`
      : (s.model_topology?loomTopoSVG(s.model_topology):''))||'';
  const id='loomreal'+(++_ILOOM_SEQ);
  return `<figure class="loom-embed loom-real" id="${id}" data-loomsrc="${esc(src)}">
      <div class="loom-real-slot"><div class="loom-real-boot">loading bigraph-loom…</div></div>
      <div class="loom-real-fallback" hidden>${fb}</div>
      <figcaption><b>bigraph-loom</b> — <span class="mono">${esc(cid)}</span>: the composite's process-bigraph (process rectangles, store nodes, and their wiring). Click a process for its contract; drag to pan, scroll to zoom.</figcaption>
    </figure>`;
}
const has = v => v!=null && !(Array.isArray(v)&&!v.length) && !(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);

/* ---------- helpers ---------- */
function statusChip(kind){
  const map={pass:['pass','Passed'],fail:['fail','Refuted'],warn:['warn','Open']};
  const [c,l]=map[kind]||map.warn; return `<span class="status ${c}"><span class="g"></span>${l}</span>`;
}
function gateOf(s){ // pass/fail
  const g = (s.sourcing&&s.sourcing.audit&&s.sourcing.audit.gate) || s.gate_status;
  if(g==='pass'||g==='passed') return 'pass';
  if(g==='fail'||g==='failed') return 'fail';

/* ---------- block renderers (spine) ---------- */
// dense tests / report-card table: description, machine criterion, provenance, final verdict + observed + margin
function testsTable(tests, traj){
  let finals={}, prov={};
  if(traj){
    if(traj.iterations&&traj.iterations.length)
      (traj.iterations[traj.iterations.length-1].tests||[]).forEach(t=>finals[t.id]={v:t.verdict,exp:t.expected,obs:t.observed,m:t.margin});
    (traj.tests||[]).forEach(t=>{prov[t.id]={exp:t.expected,provenance:t.provenance,label:t.label};});
  }
  const rows=(tests||[]).map(t=>{
    const name=t.name||t.id, desc=t.description||t.label||(prov[name]&&prov[name].label)||'';
    const meas=t.measure&&(t.measure.path||t.measure.observable||t.measure.kind);
    const cls=t.classification;
    const fin=finals[name]; const v=fin?(fin.v==='within_tol'?'pass':'fail'):null;
    const exp=(fin&&fin.exp)||(prov[name]&&prov[name].exp)||(t.pass_if&&(t.pass_if.op+' '+t.pass_if.value))||'';
    const pv=provText((prov[name]&&prov[name].provenance))||provText(t.pass_if&&t.pass_if.provenance)||(t.measure&&t.measure.kind==='audit-axis'?('audit axis '+meas):'');
    const obs=(fin&&fin.obs!=null)?`observed ${fmt(fin.obs)}`:'';
    const mg=(fin&&fin.m!=null)?` · margin ${fmt(fin.m)}`:'';
    return `<tr id="test-${esc(name)}"><td class="tname">${esc(desc||name)}
        <div class="texp mono">${esc(name)}${cls?' · '+esc(cls):''}${meas?' · '+esc(meas):''}</div>
        ${pv?`<div class="kv rationale" style="font-size:12px;margin-top:3px">${esc(pv)}</div>`:''}</td>
      <td class="tv"><div>${exp?`<span class="mono texp">${esc(exp)}</span>`:''} ${v?`<span class="chip ${v}" style="margin-left:6px">${v==='pass'?'✓ pass':'✗ fail'}</span>`:'<span class="chip">pending</span>'}</div>
        ${obs?`<div class="texp mono" style="margin-top:3px">${esc(obs)}${esc(mg)}</div>`:''}</td></tr>`;
  }).join('');
  return `<table class="ttable">${rows}</table>`;
}
function fmt(n){ if(typeof n!=='number') return esc(n); return Number.isInteger(n)?n:(Math.abs(n)<0.01?n.toExponential(1):n.toFixed(2)); }
// provenance may be a plain string OR an object ({kind, note, ...}); render a
// readable line, never a stringified object ("[object Object]").
function provText(p){ if(!p) return ''; if(typeof p==='string') return p;
  if(typeof p==='object') return String(p.note||p.rationale||p.kind||Object.values(p).filter(v=>typeof v==='string').join(' · ')||''); return String(p); }

function fbBubble(key,label){ return `<button class="fbbubble ${FB[key]?'has':''}" data-fb="${esc(key)}" data-fblabel="${esc(label)}" title="Add feedback to this section" aria-label="Add feedback to ${esc(label)}">💬</button>`; }
function part(label, body, key, klabel){ if(!body) return '';
  return `<div class="substage fbsection">${key?fbBubble(key,klabel||label):''}<div class="slabel">${label}</div>${body}</div>`; }

// traceability anchor built via the prefix helper (assembled, not a hardcoded
// href), so a finding's from_test resolves to its test-card anchor
function _traceLink(prefix, name){ return '<a class="trace-link" href="#' + prefix + '-' + esc(name) + '">' + esc(name) + '</a>'; }

// a copy-to-run command chip; '' for a falsy command (older payloads / static bundle)
function _runChip(cmd){ if (!cmd) return ''; return '<code class="run-chip" title="copy to run">' + esc(cmd) + '</code>'; }

// per-outcome rows separating the AUTHORED result from the COMPUTED/measured
// value (divergence badged), instead of a raw key:value dump
function outcomeRows(outcomes){
  return Object.entries(outcomes||{}).map(([k,o])=>{
    o=o||{}; const authored=o.result;
    const computed=(o.computed!=null?o.computed:o.measured_value);
    const diverge=(computed!=null && String(computed)!==String(authored));
    return `<div class="computed-outcome-row"><span class="mono" style="color:var(--ink-2)">${esc(k)}</span>
      <span class="outcome-chip-authored chip">authored: ${esc(authored)}</span>
      ${computed!=null?`<span class="outcome-chip-computed chip ${diverge?'reconcile-divergent':''}">computed: ${esc(computed)}</span>`:''}
      ${o.detail?`<span class="texp" style="margin-left:6px">${esc(o.detail)}</span>`:''}</div>`;
  }).join('');
}

// high-level overview shown when a study is COLLAPSED
function studySummary(s, inv){
  const chips=[];
  if(s.sourcing){
    chips.push(`<span class="chip decision">${esc(s.sourcing.decision)}</span>`);
    (s.sourcing.modules||[]).forEach(m=>chips.push(`<span class="chip mod">${esc(m)}</span>`));
    const ax=s.sourcing.audit&&s.sourcing.audit.axes;
    if(ax){ const ok=Object.values(ax).filter(v=>v==='within_tol').length; chips.push(`<span class="chip">audit ${ok}/${Object.keys(ax).length} axes</span>`); }
  } else {
    const a=s.agent_trajectory&&s.agent_trajectory.result, p=s.policy_trajectory&&s.policy_trajectory.result;
    if(a) chips.push(`<span class="chip ${a.state==='DONE'?'pass':'fail'}">agent ${a.state==='DONE'?'✓ '+a.edits+'e':'✗'}</span>`);
    if(p) chips.push(`<span class="chip ${p.state==='DONE'?'pass':'fail'}">policy ${p.state==='DONE'?'✓':'✗ give-up'}</span>`);
    const it=s.agent_trajectory&&lastIt(s); if(it) chips.push(`<span class="chip">tests ${it.n_pass}/${it.n_hard}</span>`);
  }
  const runN=(s.runs||[]).length; if(runN) chips.push(`<span class="chip">${runN} run${runN>1?'s':''}</span>`);
  const nfig=(s.figures_embedded||[]).filter(f=>f.data_uri||f.html).length; if(nfig) chips.push(`<span class="chip">${nfig} figure${nfig>1?'s':''}</span>`);
  const nfind=Array.isArray(s.findings)?s.findings.length:0; if(nfind) chips.push(`<span class="chip">${nfind} finding${nfind>1?'s':''}</span>`);
  let concl=(s.conclusion||'').replace(/##\s*Final model[\s\S]*?(?=\n##|$)/i,'').replace(/##\s*Result/i,'').trim();
  if(!concl && s.purpose && s.purpose.question) concl=s.purpose.question;
  const snip=concl.split(/(?<=[.!?])\s/).slice(0,2).join(' ');
  return `<div class="summary-chips">${chips.join('')}</div>${snip?`<div class="summary-snip">${esc(snip)}</div>`:''}`;
}

function renderStudy(s, inv, idx){
  const gate=gateOf(s), fail=gate==='fail', control=isControl(s), lo=loopOutcome(s);
  const dchip=fail?'fail':'pass';

  // OVERVIEW  (falls back to purpose.* for workspaces that use a `purpose:` block)
  const pq = s.purpose && s.purpose.question, pm = s.purpose && s.purpose.mechanism;
  const headline = s.claim || s.question || pq;
  const claimLine = s.claim? `<div class="claim">“${esc(s.claim)}”</div>` : (headline? `<div class="claim">${esc(headline)}</div>`:'');
  const bioText = s.biological_summary || pm;
  const overview = (bioText && headline)?`<div class="biology">${esc(bioText)}</div>`:'';

  // MODEL — prefer a pre-rendered bigraph-loom image (offline-safe, config
  // loaded, from `vivarium-workbench render-loom`); else the live loom iframe;
  // else the re-drawn static topology / viz.
  const bl=(s.baseline||[])[0];
  const _mcid=(s.model_topology&&s.model_topology.composite)||(bl&&bl.composite)||'';
  const loomRendered = s.model_loom
    ? `<figure class="loom-embed"><div class="loom-frame" style="height:auto;max-height:640px;overflow:auto">
         <img src="${s.model_loom}" alt="bigraph-loom view of ${esc(_mcid)}" style="width:100%;display:block"/></div>
       <figcaption><b>bigraph-loom</b> view of <span class="mono">${esc(_mcid)}</span> — the composite's bigraph with its config loaded.</figcaption></figure>`
    : '';
  // Prefer the lightweight INTERACTIVE loom (pan/zoom, hover contracts, click to
  // expand stores) when we have the wired topology; fall back to the pre-rendered
  // image, the live loom iframe, the static SVG topology, then a plain viz.
  const loomInter = (s.model_topology && (s.model_topology.edges||[]).length) ? loomInteractive(s.model_topology) : '';
  // Prefer the REAL embedded loom (served bundle); it carries its own offline
  // fallback. Then the pre-rendered image, the lightweight SVG loom, the static
  // topology, and finally a plain viz.
  const loomReal = loomRealEmbed(s);
  let modelBody = loomReal || loomRendered || loomInter || (s.model_topology ? loomTopoSVG(s.model_topology) : '') || vizModelSVG(s,inv);
  if(s.sourcing){
    modelBody += `<div class="decision-line" style="margin-top:6px"><span class="chip decision">${esc(s.sourcing.decision)}</span>
      ${(s.sourcing.modules||[]).map(m=>`<span class="chip mod">${esc(m)}</span>`).join(' ')||'<span class="chip mod">new module</span>'}</div>
      ${s.sourcing.rationale?`<div class="kv rationale">${esc(s.sourcing.rationale)}</div>`:''}`;
  } else if(bl&&bl.composite){
    modelBody += `<div class="texp mono" style="margin-top:4px">${esc(bl.composite)}</div>`;
  }

  // SIMULATION RUN
  const runs=s.runs||[];
  let runBody = runs.length?runs.map(r=>{
    return `<div class="kv" style="margin:6px 0"><span class="chip ${r.status==='completed'?'pass':''}">${esc(r.status)}</span>
      <span class="mono" style="margin-left:8px;color:var(--ink-2)">${esc(r.name||r.module||'')}</span>
      ${outcomeRows(r.outcomes)}
      ${r.provenance?`<div class="texp mono" style="margin-top:2px">${esc(provText(r.provenance))}</div>`:''}</div>`;
  }).join(''):'';
  // run-command chips: how to reproduce this study + per-variant commands
  if(s.run_commands){
    const _base = s.run_commands && s.run_commands.baseline;
    if(_base) runBody += `<div class="reproduce-line texp" style="margin-top:6px">Reproduce: ${_runChip(_base)}</div>`;
    const _rcVariants = (s.run_commands && s.run_commands.variants) || [];
    _rcVariants.forEach(_vc=>{ runBody += `<div class="texp">${esc(_vc.name)}: ${_runChip(_vc && _vc.cmd)}</div>`; });
  }

  // VISUALIZATIONS (study figures + inlined images + audit axes)
  const figs=[];
  if(s.agent_trajectory) figs.push(['Margin ladder — LLM agent', vizMarginLadder(s.agent_trajectory)]);
  if(s.policy_trajectory) figs.push(['Margin ladder — deterministic policy control', vizMarginLadder(s.policy_trajectory)]);
  if(s.sourcing) figs.push(['Capability coverage', vizCapMatrix(s,inv)]);
  let figHtml=figs.filter(f=>f[1]).map(([t,svg])=>`<div style="margin:12px 0"><div class="kicker" style="margin-bottom:6px">${esc(t)}</div>${svg}</div>`).join('');
  // on-disk study visualizations, inlined by the generator: images as data
  // URIs, and `local:` live visualizations as their committed rendered HTML.
  (s.figures_embedded||[]).forEach(im=>{
    if(im.data_uri) figHtml+=`<figure><img src="${im.data_uri}" alt="${esc(im.name)}" loading="lazy"><figcaption>${esc(im.name)}</figcaption></figure>`;
    // Interactive figure (Plotly): the generator stripped its own Plotly loader
    // and handed us just the graph <div> + its Plotly.newPlot script. Render it
    // INLINE in the main document so it draws with the report's one shared
    // Plotly.js. The script stays inert until setupLazyPlotly() runs it the first
    // time the figure is actually laid out with a real width (see below) — so a
    // tab-hidden / collapsed figure is drawn at correct size when revealed, never
    // blank.
    else if(im.html && im.interactive) figHtml+=`<figure class="embedded-viz embedded-plotly" style="margin:12px 0"><figcaption class="kicker" style="margin-bottom:6px">${esc(im.name)}</figcaption><div class="plotly-holder">${im.html}</div></figure>`;
    // Any other committed HTML figure keeps the isolated-iframe path.
    else if(im.html) figHtml+=`<figure class="embedded-viz" style="margin:12px 0"><figcaption class="kicker" style="margin-bottom:6px">${esc(im.name)}</figcaption><iframe class="viz-frame" srcdoc="${esc(im.html)}" loading="lazy" onload="try{this.style.height=(this.contentWindow.document.documentElement.scrollHeight+8)+'px';}catch(e){}"></iframe></figure>`;
    else if(im.skipped) figHtml+=`<div class="texp" style="color:var(--ink-3)">↪ ${esc(im.name)} — ${esc(im.reason||'not inlined')}</div>`;
  });
  const auditHtml=(s.sourcing&&s.sourcing.audit&&s.sourcing.audit.axes)?`<div style="margin:10px 0"><div class="kicker" style="margin-bottom:6px">Audit — sourcing gate (4 axes)</div>${vizAuditAxes(s)}</div>`:'';
  const vizBody=(figHtml+auditHtml)||'';

  // TESTS (+ build reasoning for agentic)
  let testsBody = has(s.behavior_tests)?testsTable(s.behavior_tests, s.agent_trajectory):'';
  if(s.agent_trajectory){
    const at=s.agent_trajectory;
    testsBody += `<details class="exp"><summary>How the agent converged — iteration-by-iteration</summary><div class="body">${timelineSteps(at)}`;
    if(at.result&&has(at.result.violations)) testsBody+=`<div class="kv rationale" style="margin-top:8px;color:var(--warn)"><b>Integrity trail:</b> ${at.result.violations.map(esc).join('; ')}</div>`;
    if(s.policy_trajectory){const pr=s.policy_trajectory.result||{};
      testsBody+=`<div class="kv rationale" style="margin-top:8px"><b>Deterministic-policy control:</b> ${pr.state==='DONE'?`also DONE in ${pr.edits} edits`:`gave up after ${pr.edits} edit${pr.edits==1?'':'s'}`}.</div>`;}
    testsBody+=`</div></details>`;
  }

  // FINDINGS (with traceability: from_test anchored to its test card, the cited
  // pass_if band inlined, divergence surfaced, run_ids as plain code, seeded-study back-link)
  let findingsBody='';
  if(Array.isArray(s.findings) && s.findings.length){
    const bands={}; (s.behavior_tests||[]).forEach(t=>{ if(t.pass_if) bands[t.name||t.id]=t.pass_if; });
    findingsBody=s.findings.map(f=>{
      const ok=(f.status==='passed'||f.status==='pass');
      const ft=f.evidence&&f.evidence.from_test, band=ft&&bands[ft];
      const runIds=(f.provenance&&f.provenance.run_ids)||[];
      const dv=f.divergence_factor;
      return `<div class="finding-traceability" style="margin:8px 0">
        <span class="chip ${ok?'pass':''}">${esc((f.id?f.id+' · ':'')+(f.status||'finding'))}</span>
        <div class="kv rationale">${esc(f.statement||'')}</div>
        ${ft?`<div class="texp">from test: ${_traceLink('test',ft)}${band?` <span class="pass_if-band mono">${esc((band.op||'')+' '+(band.value!=null?band.value:''))}</span>`:''}</div>`:''}
        ${dv!=null?`<div class="finding-divergence texp">divergence ${esc(dv)}× vs expected</div>`:''}
        ${runIds.length?`<div class="texp">runs: ${runIds.map(r=>`<code>${esc(r)}</code>`).join(' ')}</div>`:''}
        ${f.seeded_study?`<div class="finding-seeded texp">seeded study: ${_traceLink('s',f.seeded_study)}</div>`:''}</div>`;
    }).join('');
  }

  // DECISION  (conclusion, or a conclusion_logic block for pipeline-style studies)
  let conclusion=(s.conclusion||'').replace(/##\s*Final model[\s\S]*?(?=\n##|$)/i,'').replace(/##\s*Result/i,'').trim();
  if(!conclusion && s.conclusion_logic && s.conclusion_logic.if_primary_tests_pass){
    const cl=s.conclusion_logic.if_primary_tests_pass;
    conclusion=[cl.implementation_status, cl.biological_validation].filter(Boolean).join(' ');
  }
  // gate divergence: the code-computed gate verdict vs the authored gate_status
  let gateDiv='';
  const cg=s.computed_gate_verdict;
  if(cg){
    const code=cg.result||'', authored=s.gate_status||'';
    const same=(code===authored)||(code==='passing'&&authored==='passed')||(code==='failing'&&authored==='failed');
    if(cg.diverges_from_authored===true || (code && authored && !same))
      gateDiv=`<div class="sp-gate-divergence chip warn" style="margin-top:8px">⚠ gate divergence — code: ${esc(code)} · authored: ${esc(authored)}</div>`;
  }
  const decisionBody=`<div class="decbox"><div>${statusChip(dchip)}</div>
    <div><div class="dverdict"><b>${fail?'Gate refused':'Gate cleared'}</b> · ${esc(s.confidence||'')}${lo?` · <span class="mono">${esc(lo.result)} (${esc(lo.detail||'')})</span>`:''}</div>
    ${conclusion?`<div class="dnarr">${mdLite(conclusion)}</div>`:''}${gateDiv}</div></div>`;

  return `<section class="card collapsed ${fail?'is-fail':''} ${control?'is-control':''}" id="s-${s.slug}">
    <div class="card-h">
      <span class="ctoggle">▾</span>
      <span class="cnum">${String(idx).padStart(2,'0')}</span>
      <h3 class="ctitle">${esc(s.title)}</h3>
      <div class="cright">${control?'<span class="control-kick">⚑ Adversarial control</span>':''}${statusChip(dchip)}</div>
    </div>
    ${claimLine}${overview}
    <div class="study-summary">${studySummary(s,inv)}</div>
    <div class="study-detail">
      ${part('Model', modelBody, 'study:'+s.slug+'/model', s.title+' · Model')}
      ${part('Simulation run', runBody, 'study:'+s.slug+'/simulation', s.title+' · Simulation run')}
      ${part('Visualizations', vizBody, 'study:'+s.slug+'/visualizations', s.title+' · Visualizations')}
      ${part('Tests', testsBody, 'study:'+s.slug+'/tests', s.title+' · Tests')}
      ${part('Findings', findingsBody, 'study:'+s.slug+'/findings', s.title+' · Findings')}
      ${part('Decision', decisionBody, 'study:'+s.slug+'/decision', s.title+' · Decision')}
      ${feedbackRow('study:'+s.slug, 'this whole study')}
    </div>
  </section>`;
}

/* ---------- executive band ---------- */
// The report adapts to what the studies ACTUALLY are, rather than assuming an
// agent-vs-policy competition. Three modes:
//   sourcing  — studies carry a `sourcing` decision (model-sourcing investigations)
//   agentic   — studies carry an `agent_trajectory` (LLM-agent vs policy tasks)
//   generic   — everything else (a normal study: model · run · tests · decision)
function reportMode(inv){
  const ss=inv.studies||[];
  // 'sourcing' is for a sourcing-AUDIT investigation — one whose figure is the
  // reuse/compose/build-new decision map with an audit gate. Requires the actual
  // audit data (s.sourcing.audit), NOT merely a `sourcing.decision`: that is now
  // standard contract metadata on nearly every study, so keying off `s.sourcing`
  // alone mislabelled ordinary claim/agentic investigations as sourcing and
  // showed them an empty, trap-captioned decision map.
  if(ss.some(s=>s.agent_trajectory||s.policy_trajectory)) return 'agentic';
  if(ss.some(s=>s.sourcing&&s.sourcing.audit)) return 'sourcing';
  return 'generic';
}
function renderExec(inv){
  const studies=inv.studies;
  const MODE=reportMode(inv);
  const gates=studies.map(gateOf);
  const nPass=gates.filter(g=>g==='pass').length, nFail=gates.filter(g=>g==='fail').length;
  const exv=inv.executive||{};
  const verdictText = exv.verdict || inv.question;
  const status = exv.verdict_status==='passed'?'pass':(inv.status==='in_progress'?'warn':'pass');
  // stat strip
  let stats='';
  if(MODE==='sourcing'){
    const dec={};studies.forEach(s=>{const d=s.sourcing&&s.sourcing.decision;if(d)dec[d]=(dec[d]||0)+1;});
    stats=[[studies.length,'studies'],[dec['reuse']||0,'reuse'],[dec['compose']||0,'compose'],[dec['build-new']||0,'build-new'],[nFail,'trap refused ✗','fail']];
  }else if(MODE==='agentic'){
    let aDone=0,pDone=0,pTot=0;
    studies.forEach(s=>{ if(s.agent_trajectory&&s.agent_trajectory.result&&s.agent_trajectory.result.state==='DONE')aDone++;
      if(s.policy_trajectory){pTot++; if(s.policy_trajectory.result&&s.policy_trajectory.result.state==='DONE')pDone++;} });
    stats=[[studies.length,'tasks'],[aDone+'/'+studies.length,'agent solved','pass'],[pDone+'/'+pTot,'policy solved'],[studies.length-pDone,'need an agent']];
  }else{
    // generic: describe the evidence base — studies, gate outcomes, acceptance tests
    let nTests=0; studies.forEach(s=>{ nTests+=(s.behavior_tests||[]).length; });
    stats=[[studies.length,'studies'],[nPass,'passed','pass']];
    if(nFail) stats.push([nFail,'failing','fail']);
    stats.push([nTests,'acceptance test'+(nTests===1?'':'s')]);
  }
  const statHtml=stats.map(([n,l,c])=>`<div class="stat"><div class="num ${c||''}">${n}</div><div class="lbl">${l}</div></div>`).join('');
  // glance table
  const glance=studies.map((s,i)=>{
    const g=gateOf(s), role=roleLine(s,inv), ctrl=isControl(s);
    return `<tr><td class="idx">${i+1}</td>
      <td><a class="st" href="#s-${s.slug}">${esc(s.title)}</a>${ctrl?'<span class="flag">⚑ control</span>':''}</td>
      <td style="color:var(--ink-2)">${role}</td>
      <td style="text-align:right">${g==='fail'?'<span class="chip fail">✗ refuted</span>':g==='pass'?'<span class="chip pass">✓ pass</span>':'<span class="chip">open</span>'}</td></tr>`;
  }).join('');
  const howto = MODE==='sourcing'
    ? `Each study is one <b>sourcing decision</b> — reuse an existing module, compose several, or build a new one. A deterministic audit grades the decision on four axes (<span class="mono">source_fit · reinvention · novelty_justified · survey_recorded</span>) by checking <span class="mono">requires ⊆ provided</span> against the module catalog. A study whose gate <b>fails</b> while it is still marked complete is an <b>adversarial control</b> — a plausible-but-wrong choice the audit is meant to refuse.`
    : MODE==='agentic'
    ? `Each study is a <b>model-building task</b> run twice: an LLM agent and a deterministic worst-margin policy each try to build a real process-bigraph model that passes the same <b>locked</b> acceptance tests. The <b>margin ladder</b> shows each test across build iterations; the <b>timeline</b> shows what the agent edited and why. The contrast is where an agent is genuinely required — where the policy has no move for the real fix and gives up.`
    : `Each study builds and runs a real <b>process-bigraph composite</b> and checks it against declared <b>acceptance tests</b>. Each study section shows its <b>model</b> (the composite's bigraph), how to <b>reproduce the run</b>, its <b>visualizations</b>, the <b>tests</b> and their verdicts, and the <b>decision</b>. Studies are collapsed to a high-level overview — expand any study for the full detail.`;
  return `<div class="verdict fbsection ${status==='fail'?'is-fail':''}">
      ${fbBubble('overview','Investigation overview')}
      <div class="vhead">${statusChip(status)}<span class="kicker">Verdict</span></div>
      <p class="vtext">${esc(verdictText)}</p>
      ${exv.what_is_this?`<div class="what">${esc(exv.what_is_this)}</div>`:(inv.hypothesis?`<div class="what">${esc(inv.hypothesis)}</div>`:'')}
      ${inv.lead?`<div class="what" style="margin-top:8px">${esc(inv.lead)}</div>`:''}
      <details class="exp"><summary>How to read this report</summary><div class="body">${howto}</div></details>
    </div>
    <div class="stats">${statHtml}</div>
    <div class="sec-h"><h2>At a glance</h2><span class="rule"></span></div>
    <table class="glance"><thead><tr><th></th><th>Study</th><th>${MODE==='sourcing'?'Sourcing decision':MODE==='agentic'?'Agent vs policy':'Evidence'}</th><th style="text-align:right">Gate</th></tr></thead><tbody>${glance}</tbody></table>`;
}
// dedicated place for the FINAL investigation-level visualizations
function renderInvViz(inv){
  const figs=[];
  const MODE=reportMode(inv);
  if(MODE==='sourcing'){ figs.push(['Sourcing decision map', vizDecisionMap(inv)]); }
  else if(MODE==='agentic'){ figs.push(['Agent vs policy — outcomes', vizOutcomeBar(inv)]); figs.push(['Final test outcomes', vizGateMatrix(inv)]); }
  else { figs.push(['Test outcomes across studies', vizGateMatrix(inv)]); }
  const live=figs.filter(f=>f[1]); if(!live.length) return '';
  return `<div id="inv-viz" class="fbsection">${fbBubble('figures','Investigation visualizations')}<div class="sec-h"><h2>Investigation visualizations</h2><span class="rule"></span></div>
    <p style="color:var(--ink-2);font-size:14px;max-width:none;margin:0 0 6px">The whole investigation in a few figures — the synthesis across all ${inv.studies.length} studies.</p>
    ${live.map(([t,svg])=>`<div style="margin:20px 0"><div class="kicker" style="margin-bottom:8px">${esc(t)}</div>${svg}</div>`).join('')}</div>`;
}
function roleLine(s,inv){
  if(s.sourcing){ const mods=(s.sourcing.modules||[]).join(' + ')||'new module';
    return `${esc(s.sourcing.decision)} · <span class="mono">${esc(mods)}</span>`; }
  const a=s.agent_trajectory&&s.agent_trajectory.result, p=s.policy_trajectory&&s.policy_trajectory.result;
  if(a||p){
    const av=a?(a.state==='DONE'?`agent ✓ ${a.edits}e`:'agent ✗'):'';
    const pv=p?(p.state==='DONE'?` · policy ✓`:` · policy ✗ give-up`):'';
    return av+pv;
  }
  // generic: the most informative available summary — test count + what it found
  const nt=(s.behavior_tests||[]).length;
  const c=s.verdict_counts||{}; const np=c.passed||0;
  let summary=s.claim||(s.findings&&s.findings[0]&&(s.findings[0].summary||s.findings[0].claim))||'';
  summary=String(summary).split('\n')[0].trim();
  const bits=[];
  if(nt) bits.push(`${np?np+'/':''}${nt} test${nt===1?'':'s'}${np?' pass':''}`);

  if(!FB[key].note && !FB[key].disp) delete FB[key]; saveFB(); }

    </div>

}
function yq(s){ return '"'+String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,' ')+'"'; }
function genYaml(inv){
  const L=['feedback_report:','  investigation: '+inv.slug,'  title: '+yq(inv.title),
    '  reviewer: ""','  date: ""'];
  const emit=(k,ind)=>{ const f=FB[k]||{}; if(f.disp) L.push(ind+'disposition: '+f.disp); if(f.note) L.push(ind+'note: '+yq(f.note)); };
  if(FB['overall']){ L.push('  overall:'); emit('overall','    '); }
  const invSecs=Object.keys(FB).filter(k=>k!=='overall'&&!k.startsWith('study:'));
  if(invSecs.length){ L.push('  sections:'); invSecs.forEach(k=>{ L.push('    - section: '+k); emit(k,'      '); }); }
  const rows=inv.studies.filter(s=>Object.keys(FB).some(k=>k==='study:'+s.slug||k.startsWith('study:'+s.slug+'/')));
  if(rows.length){ L.push('  studies:');
    rows.forEach(s=>{ L.push('    - study: '+s.slug); L.push('      verdict: '+gateOf(s));
      if(FB['study:'+s.slug]) emit('study:'+s.slug,'      ');
      const secs=Object.keys(FB).filter(k=>k.startsWith('study:'+s.slug+'/'));
      if(secs.length){ L.push('      sections:'); secs.forEach(k=>{ L.push('        - section: '+k.split('/')[1]); emit(k,'          '); }); }
    });
  }
  if(!Object.keys(FB).length) L.push('  # (no notes yet — hover any section and click the 💬 to add feedback)');
  return L.join('\n')+'\n';
}

/* ---------- spine presentation: verdict DAG · acceptance roll-up · AC gating matrix ---------- */
const VG={passed:['✅','passed'],failing:['⛔','failing'],blocked:['⚠','blocked'],
          needs_calibration:['🔄','needs calibration'],not_started:['◽','not evaluated']};
function _spineVerdictBadge(v){ const g=VG[v]||VG.not_started; return `<span class="spine-badge v-${v}">${g[0]} ${g[1]}</span>`; }
function _spineCountLabel(c){ if(!c) return ''; const p=[]; if(c.passed) p.push(c.passed+' passed'); if(c.skipped) p.push(c.skipped+' skipped'); if(c.failed) p.push(c.failed+' failed'); return p.join(' · '); }
function _acResultBadge(r){ const ok=(r==='passing'||r==='passed'||r==='passing-with-caveats'); const bad=(r==='failing'||r==='failed'); return `<span class="chip ${ok?'pass':(bad?'fail':'')}">${esc(r||'—')}</span>`; }

// V8 — verdict-annotated study DAG (renders only when there are dependency edges;
// otherwise the at-a-glance table already conveys the flat list)
function _verdictDagHtml(sp){
  const dag=sp&&sp.verdict_dag; if(!dag||!dag.edges||!dag.edges.length) return '';
  const nodes=dag.nodes, edges=dag.edges;
  const byDepth={}; let maxD=0;
  nodes.forEach(n=>{ (byDepth[n.depth]=byDepth[n.depth]||[]).push(n); if(n.depth>maxD)maxD=n.depth; });
  const colW=210, rowH=64, padL=8, padT=20, bw=180, bh=46;
  const maxRows=Math.max(...Object.values(byDepth).map(a=>a.length),1);
  const W=padL+(maxD+1)*colW, H=padT+maxRows*rowH+10;
  const pos={};
  Object.keys(byDepth).forEach(d=>{ byDepth[d].forEach((n,i)=>{ pos[n.slug]={x:padL+d*colW+bw/2, y:padT+i*rowH+bh/2}; }); });
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12">`;
  edges.forEach(e=>{ const a=pos[e.from], b=pos[e.to]; if(!a||!b) return;
    sv+=`<line x1="${a.x+bw/2}" y1="${a.y}" x2="${b.x-bw/2}" y2="${b.y}" stroke="var(--line-2)" marker-end="url(#dgar)"/>`; });
  nodes.forEach(n=>{ const p=pos[n.slug]; const g=VG[n.verdict]||VG.not_started;
    sv+=`<a href="#s-${n.slug}"><rect x="${p.x-bw/2}" y="${p.y-bh/2}" width="${bw}" height="${bh}" rx="9" fill="var(--surface)" stroke="var(--line-2)"/>`;
    sv+=`<text x="${p.x-bw/2+10}" y="${p.y-4}" fill="var(--ink)" font-weight="600" font-size="12">${g[0]} ${esc(n.title.length>20?n.title.slice(0,19)+'…':n.title)}</text>`;
    const cl=_spineCountLabel(n.counts);
    sv+=`<text x="${p.x-bw/2+10}" y="${p.y+13}" fill="var(--ink-3)" font-size="10.5">${g[1]}${cl?' · '+esc(cl):''}</text></a>`; });
  sv+=`<defs><marker id="dgar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--line-2)"/></marker></defs></svg>`;
  const legend=Object.keys(VG).map(k=>`<span class="spine-legend-item">${VG[k][0]} ${VG[k][1]}</span>`).join('');
  return `<div class="study-verdict-dag"><div class="fig-scroll">${sv}</div>
    <div class="spine-legend">${legend}</div>
    <figcaption>Member studies as a dependency DAG (edges from <span class="mono">parent_studies</span>), each badged with its code-computed gate verdict.</figcaption></div>`;
}
function _acceptanceRollupHtml(sp){
  const a=sp&&sp.acceptance; if(!a||!(a.criteria&&a.criteria.length)) return '';
  const rows=a.criteria.map(c=>`<tr><td>${c.study?`<a href="#s-${esc(c.study)}">${esc(c.study)}</a>`:'—'}</td><td>${esc(c.behavior||'')}</td><td class="tv">${_acResultBadge(c.result)}</td></tr>`).join('');
  const div=a.diverges_from_authored?`<span class="acceptance-divergence chip warn">⚠ code differs from authored</span>`:'';
  return `<div class="acceptance-rollup"><div class="slabel">Acceptance roll-up ${div}</div>
    <p style="color:var(--ink-2);font-size:13.5px;max-width:none;margin:2px 0 8px">The investigation's acceptance criteria connected to their gating study and code-computed result — the spine roll-up, not a re-computation.</p>
    <table class="ttable"><tbody>${rows}</tbody></table></div>`;
}
function _acGatingMatrixHtml(sp){
  const m=sp&&sp.ac_matrix; if(!m||!(m.criteria&&m.criteria.length)) return '';
  const rows=m.criteria.map(c=> c.gap
    ? `<tr><td>${esc(c.behavior||'')}</td><td class="gap" style="color:var(--fail)">no study linked — gap</td><td></td></tr>`
    : `<tr><td>${esc(c.behavior||'')}</td><td><a href="#s-${esc(c.study)}">${esc(c.study)}</a></td><td class="tv">${_acResultBadge(c.result)}</td></tr>`).join('');
  const gaps=m.criteria.filter(c=>c.gap).length;
  const foot=gaps?`<div class="texp" style="color:var(--ink-3);margin-top:6px">${gaps} acceptance criteria have no study linked (gaps).</div>`:'';
  return `<div class="ac-gating-matrix"><div class="slabel">Acceptance-criteria gating matrix</div>
    <table class="ttable"><thead><tr><th>Criterion</th><th>Gating study</th><th class="tv">Result</th></tr></thead><tbody>${rows}</tbody></table>${foot}</div>`;
}
function renderSpine(inv){
  const sp=inv.spine; if(!sp) return '';
  const dag=_verdictDagHtml(sp), acc=_acceptanceRollupHtml(sp), mx=_acGatingMatrixHtml(sp);
  if(!dag && !acc && !mx) return '';
  return `<div id="spine-presentation" class="fbsection">${fbBubble('spine','Spine — verdicts & acceptance')}
    <div class="sec-h"><h2>Verdicts &amp; acceptance</h2><span class="rule"></span></div>
    ${dag}${acc?`<div style="margin-top:16px">${acc}</div>`:''}${mx?`<div style="margin-top:16px">${mx}</div>`:''}</div>`;
}

/* ---------- interactive (Plotly) figures — LAZY, visibility-driven ----------
   Each interactive figure is inlined as its graph <div> + its Plotly.newPlot
   <script>, which is INERT until the figure first becomes visible. We must NOT
   render eagerly at load: a figure inside a collapsed study card (display:none)
   or below the fold has zero width, so Plotly.newPlot would lay it out at 0px →
   a blank box that a later resize can't reliably recover (seen in Safari when a
   figure is revealed by a subnav tab / card expand). Instead each figure is
   rendered the first time it is actually laid out with a real width — created at
   the correct size. Fully guarded: no Plotly bundle, or a malformed figure, is a
   silent no-op. */
function _isLaidOut(el){
  try{ const r=el.getBoundingClientRect(); return r.width>2 && r.height>2; }
  catch(e){ return false; }
}
function _resizeFig(fig){
  fig.querySelectorAll('.plotly-graph-div').forEach(d=>{ try{ Plotly.Plots.resize(d); }catch(e){} });
}
// Run a figure's inert <script>s (re-creating them so they actually execute),
// which calls Plotly.newPlot into the now-visible, real-width <div>. Idempotent:
// a figure is rendered at most once, then only resized.
function renderPlotlyFigure(fig){
  if(!fig || typeof Plotly==='undefined') return;
  if(fig.dataset.plRendered){ _resizeFig(fig); return; }
  if(!_isLaidOut(fig)) return;               // not visible yet — wait for a later trigger
  fig.dataset.plRendered='1';
  fig.querySelectorAll('script').forEach(old=>{
    try{
      const s=document.createElement('script');
      if(old.src) s.src=old.src; else s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    }catch(e){}
  });
  // one post-layout resize so the plot fills its container exactly
  try{ requestAnimationFrame(()=>_resizeFig(fig)); }catch(e){ _resizeFig(fig); }
}
function setupLazyPlotly(){
  if(typeof Plotly==='undefined') return;    // no shared bundle → leave figures inert
  const figs=[...document.querySelectorAll('figure.embedded-plotly')];
  if(!figs.length) return;
  // Sweep every figure: render the visible-and-unrendered ones, resize the rest.
  // This is the reliable path for a subnav-tab click / card expand / expand-all —
  // ANY reveal that changes layout — independent of scrolling.
  const sweep=()=>{ figs.forEach(f=>{ if(_isLaidOut(f)) renderPlotlyFigure(f); }); };
  // Primary: IntersectionObserver renders a figure as it scrolls into view (or
  // becomes visible when its card expands). rootMargin pre-renders slightly early.
  try{
    const io=new IntersectionObserver(entries=>{
      entries.forEach(en=>{ if(en.isIntersecting){ renderPlotlyFigure(en.target);
        if(en.target.dataset.plRendered) io.unobserve(en.target); } });
    }, {root:null, rootMargin:'250px 0px', threshold:0.01});
    figs.forEach(f=>io.observe(f));
  }catch(e){}
  // Belt-and-suspenders for Safari file:// timing: any card class flip (collapse/
  // expand, subnav tab, expand-all) → sweep on the next frame.
  try{
    const mo=new MutationObserver(ms=>{ if(ms.some(m=>m.attributeName==='class')){
      try{ requestAnimationFrame(sweep); }catch(e){ sweep(); } } });
    document.querySelectorAll('.card').forEach(c=>mo.observe(c,{attributes:true,attributeFilter:['class']}));
  }catch(e){}
  // Subnav tab / index click expands + scrolls its target card; sweep just after.
  document.addEventListener('click', e=>{ try{ if(e.target.closest('.subnav a')||e.target.id==='expandall'){
    setTimeout(sweep,60); setTimeout(sweep,220); } }catch(err){} }, true);
  // Keep already-drawn figures crisp on viewport resize.
  window.addEventListener('resize', ()=>{ figs.forEach(f=>{ if(f.dataset.plRendered) _resizeFig(f); }); });
  // Anchored deep-link (opening the report at #s-<slug>): render after layout.
  try{ setTimeout(sweep,120); }catch(e){}
}

/* ---------- interactive loom: hover / tooltip / expand / pan-zoom ---------- */
function _iloomHi(id,kind,name){
  const root=document.getElementById(id); if(!root) return;
  root.classList.add('il-active');
  root.querySelectorAll('.il-edge').forEach(e=>{
    const on = kind==='proc' ? e.getAttribute('data-p')===name : e.getAttribute('data-c')===name;
    e.classList.toggle('on',on); e.classList.toggle('off',!on);
  });
  const conn=new Set();
  root.querySelectorAll('.il-edge.on').forEach(e=>{ conn.add('p:'+e.getAttribute('data-p')); conn.add('c:'+e.getAttribute('data-c')); });
  root.querySelectorAll('.il-proc').forEach(g=>g.classList.toggle('dim', !conn.has('p:'+g.getAttribute('data-proc')) && !(kind==='proc'&&g.getAttribute('data-proc')===name)));
  root.querySelectorAll('.il-comp').forEach(g=>g.classList.toggle('dim', !conn.has('c:'+g.getAttribute('data-comp')) && !(kind==='comp'&&g.getAttribute('data-comp')===name)));
}
function _iloomClear(id){ const r=document.getElementById(id); if(!r) return;
  r.classList.remove('il-active');
  r.querySelectorAll('.on,.off,.dim').forEach(e=>e.classList.remove('on','off','dim'));
  const t=r.querySelector('.il-tip'); if(t) t.hidden=true; }
function _iloomTip(evt,id,text){ const r=document.getElementById(id); if(!r) return;
  const t=r.querySelector('.il-tip'); if(!t) return;
  t.textContent=text; t.hidden=false;
  const b=r.getBoundingClientRect();
  t.style.left=Math.min(b.width-12, evt.clientX-b.left+12)+'px';
  t.style.top=Math.max(4, evt.clientY-b.top-10)+'px'; }
function _iloomExpand(id,comp){ const r=document.getElementById(id); if(!r) return;
  let leaves={}; try{ leaves=JSON.parse(r.getAttribute('data-leaves')||'{}'); }catch(e){}
  let panel=r.querySelector('.il-stores');
  if(!panel){ panel=document.createElement('div'); panel.className='il-stores'; r.appendChild(panel); }
  const list=(leaves[comp]||[]);
  if(panel.dataset.comp===comp && !panel.hidden){ panel.hidden=true; panel.dataset.comp=''; return; }
  panel.dataset.comp=comp; panel.hidden=false;
  panel.innerHTML=`<b>cell/${comp}</b> — ${list.length} store${list.length==1?'':'s'}<div class="il-leaves">`+
    list.map(s=>`<span class="il-leaf">${esc(s)}</span>`).join('')+`</div>`;
}
function setupInteractiveLooms(){
  document.querySelectorAll('.iloom').forEach(root=>{
    const svg=root.querySelector('svg'), view=root.querySelector('.il-view'); if(!svg||!view) return;
    let z=1, tx=0, ty=0, drag=false, sx=0, sy=0;
    const apply=()=>view.setAttribute('transform',`translate(${tx},${ty}) scale(${z})`);
    svg.addEventListener('wheel',ev=>{ ev.preventDefault(); const f=ev.deltaY<0?1.12:1/1.12;
      z=Math.max(0.3,Math.min(6,z*f)); apply(); },{passive:false});
    svg.addEventListener('mousedown',ev=>{ if(ev.target.closest('.il-comp'))return; drag=true; sx=ev.clientX-tx; sy=ev.clientY-ty; svg.classList.add('grabbing'); });
    window.addEventListener('mousemove',ev=>{ if(!drag)return; tx=ev.clientX-sx; ty=ev.clientY-sy; apply(); });
    window.addEventListener('mouseup',()=>{ drag=false; svg.classList.remove('grabbing'); });
  });
}
// Mount the embedded REAL loom(s) lazily (only one study section is visible at a
// time, so we don't boot React/ReactFlow for every study up front). The loom
// posts {type:'explore:ready'} once it mounts; if none arrives (a standalone
// download with no sibling loom bundle), swap in the static-topology fallback.
function setupRealLooms(){
  const frames=[...document.querySelectorAll('.loom-real')];
  if(!frames.length) return;
  const booted=new WeakSet();
  window.addEventListener('message',ev=>{
    const d=ev.data; if(!d||d.type!=='explore:ready') return;
    frames.forEach(f=>{ const ifr=f.querySelector('iframe');
      if(ifr&&ifr.contentWindow===ev.source){ booted.add(f); const b=f.querySelector('.loom-real-boot'); if(b) b.remove(); } });
  });
  const mount=f=>{
    if(f._mounted) return; f._mounted=true;
    const slot=f.querySelector('.loom-real-slot'), src=f.getAttribute('data-loomsrc'); if(!slot||!src) return;
    const ifr=document.createElement('iframe'); ifr.title='bigraph-loom'; ifr.setAttribute('loading','lazy'); ifr.src=src;
    slot.appendChild(ifr);
    setTimeout(()=>{ if(!booted.has(f)){ slot.hidden=true; const fb=f.querySelector('.loom-real-fallback'); if(fb) fb.hidden=false; } }, 8000);
  };
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{es.forEach(e=>{ if(e.isIntersecting){ mount(e.target); io.unobserve(e.target); } });},{rootMargin:'250px'});
    frames.forEach(f=>io.observe(f));
  } else { frames.forEach(mount); }
}

    if(nd==='ok') row.querySelector('[data-disp=ok]').classList.add('on-ok');
    if(nd==='revise') row.querySelector('[data-disp=revise]').classList.add('on-rev'); return; }
  // expand/collapse all
  if(e.target.id==='expandall'){ document.querySelectorAll('.card').forEach(c=>c.classList.remove('collapsed')); return; }
  if(e.target.id==='collapseall'){ document.querySelectorAll('.card').forEach(c=>c.classList.add('collapsed')); return; }
  // index link → expand the target study before scrolling to it
  const link=e.target.closest('.subnav a');
  if(link){ const href=link.getAttribute('href')||''; if(href.startsWith('#s-')){ const c=document.getElementById(href.slice(1)); if(c) c.classList.remove('collapsed'); } return; }
  // a collapsed card is clickable anywhere to expand (ignore real controls/links)
  const anyCard=e.target.closest('.card');
  if(anyCard && anyCard.classList.contains('collapsed') && !e.target.closest('a,button,summary,input,textarea,select')){
    anyCard.classList.remove('collapsed'); return; }
  // header → collapse an expanded study
  const head=e.target.closest('.card-h');
  if(head){ head.closest('.card').classList.toggle('collapsed'); }
});
// modal
const modalbg=document.getElementById('modalbg');
// "Review & export" downloads the YAML feedback report straight to the downloads
// folder (no modal). A Blob + transient <a download> — works in the served page.
document.getElementById('fbfloat').onclick=()=>{
  const yaml=genYaml(INV);
  const blob=new Blob([yaml],{type:'application/x-yaml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='feedback-'+(INV.slug||'investigation')+'.yaml';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  const btn=document.getElementById('fbfloat');
  const prev=btn.innerHTML; btn.innerHTML='Downloaded ✓';
  setTimeout(()=>{btn.innerHTML=prev;},1600);
};
document.getElementById('fbclose').onclick=()=>modalbg.classList.remove('open');
modalbg.onclick=e=>{ if(e.target===modalbg) modalbg.classList.remove('open'); };
document.getElementById('fbcopy').onclick=()=>{ const ta=document.getElementById('fbyaml'); ta.select();
  try{ navigator.clipboard.writeText(ta.value); }catch(e){ document.execCommand&&document.execCommand('copy'); }
  document.getElementById('fbcopy').textContent='Copied ✓'; setTimeout(()=>document.getElementById('fbcopy').textContent='Copy YAML',1500); };
render(INV);
</script>
